# fly.toml app configuration file generated for cold-approach on 2026-08-05T18:32:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cold-approach'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'pnpm --filter @outreach-engine/db db:migrate:deploy'

[env]
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
