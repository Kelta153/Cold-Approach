name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://outreach:outreach@localhost:5432/outreach_ci
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads it from package.json's own
      # "packageManager": "pnpm@9.15.0" field. Specifying both is a hard error
      # (ERR_PNPM_BAD_PM_VERSION), and package.json is the single source of truth for local
      # dev too, so that's the one to keep.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        # --concurrency=1: running every package's vitest workers fully in parallel can exhaust
        # the runner's process/thread limits and crash with a spurious "Worker exited
        # unexpectedly" — serializing is reliable and still fast (whole suite is well under a
        # minute). See CLAUDE.md.
        run: pnpm turbo test --concurrency=1

      - name: Prisma migrate deploy (dry run)
        run: pnpm --filter @outreach-engine/db exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script

      - name: Build
        run: pnpm turbo build
